    <!--
    img是图片，src是来源，=后面是对应的具体图片来源，
    这里请求了一个网站的一个图片
    -->
    <img src="https://picsum.photos/200"alt="一张随机照片">

    <!--
    a是链接，href是“超文本引用”，用来指定一个链接目标地址或外部资源位置
    -->
    <a href="https://developer.mozilla.org/zh-CN">去 MDN 查文档</a>

    <!--
    ul是无序列表，属于列表类型
    列表类型有许多种：
    ul：无序列表（unordered list），项目没有顺序，默认显示圆点。
    ol：有序列表（ordered list），项目有顺序，默认显示数字。
    li：列表项（list item），表示列表中的某一项。
    -->
    <ul>
        <li>HTML 管结构</li>
        <li>CSS 管样式</li>
        <li>JaveScript 管行为</li>
    </ul>

    <!--
    button是一个按钮，属于表单类型
    表单类型有多种:
    form：表单容器，负责把用户输入的数据提交到服务器。
    input：输入控件，用来让用户输入、选择、勾选、上传等。
    button：按钮，用来提交表单、重置表单，或者执行自定义操作。
    -->
    <button>这是一个按钮，可以点我</button>
